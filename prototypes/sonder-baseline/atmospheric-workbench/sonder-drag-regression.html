<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sonder drag regression</title>
  <style>
    body { margin: 0; background: #111; color: #ddd; font: 14px/1.5 system-ui, sans-serif; }
    #results { padding: 16px; }
    .pass { color: #82e89a; }
    .fail { color: #ff8a8a; }
    iframe { position: absolute; left: -10000px; width: 1440px; height: 900px; border: 0; }
  </style>
</head>
<body>
  <main id="results" aria-live="polite">Running drag regressions…</main>
  <script>
    const results = document.getElementById('results');

    const nextFrame = (view) => new Promise((resolve) => view.requestAnimationFrame(() => view.requestAnimationFrame(resolve)));

    const loadWorkbench = ({ height = 900, width = 1440, persistenceKey = '' } = {}) => new Promise((resolve, reject) => {
      const frame = document.createElement('iframe');
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
      const params = new URLSearchParams({ test: `${Date.now()}-${Math.random()}` });
      if (persistenceKey) params.set('persistence', persistenceKey);
      frame.src = `./sonder-workbench-calibration.html?${params}`;
      frame.addEventListener('load', async () => {
        try {
          frame.contentDocument.body.style.margin = '0';
          await nextFrame(frame.contentWindow);
          resolve(frame);
        } catch (error) {
          reject(error);
        }
      }, { once: true });
      document.body.append(frame);
    });

    const loadPreview = ({ height = 900, width = 1440 } = {}) => new Promise((resolve, reject) => {
      const frame = document.createElement('iframe');
      frame.style.width = `${width}px`;
      frame.style.height = `${height}px`;
      frame.src = `./sonder-workbench-calibration-preview.html?test=${Date.now()}-${Math.random()}`;
      frame.addEventListener('load', async () => {
        try {
          await nextFrame(frame.contentWindow);
          const previewFrame = frame.contentDocument.querySelector('iframe');
          const previewDocument = previewFrame?.contentDocument;
          const previewWindow = previewFrame?.contentWindow;
          if (!previewDocument || !previewWindow) throw new Error('Preview sandbox prevented same-origin verification');
          await nextFrame(previewWindow);
          resolve({ frame, previewDocument, previewWindow });
        } catch (error) {
          reject(error);
        }
      }, { once: true });
      document.body.append(frame);
    });

    const center = (element) => {
      const rect = element.getBoundingClientRect();
      return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    };

    const pointer = (target, type, point) => target.dispatchEvent(new PointerEvent(type, {
      bubbles: true,
      cancelable: true,
      button: 0,
      buttons: ['pointerup', 'pointercancel'].includes(type) ? 0 : 1,
      clientX: point.x,
      clientY: point.y,
      isPrimary: true,
      pointerId: 1,
      pointerType: 'mouse'
    }));

    const beginDrag = (doc, handle) => {
      const start = center(handle);
      pointer(handle, 'pointerdown', start);
      pointer(doc, 'pointermove', { x: start.x + 8, y: start.y + 1 });
    };

    const beginPanelTabDrag = (doc, tab) => {
      const start = center(tab);
      pointer(tab, 'pointerdown', start);
      pointer(doc, 'pointermove', { x: start.x + 8, y: start.y + 1 });
      return start;
    };

    const panelTabOrder = (doc) => Array.from(doc.querySelectorAll('[data-panel-tab]')).map((tab) => tab.textContent.trim()).join(',');

    const dragCatalogResultToPoint = (doc, result, destination) => {
      const start = center(result);
      const catalogRect = doc.querySelector('[data-widget-catalog]').getBoundingClientRect();
      pointer(result, 'pointerdown', start);
      pointer(doc, 'pointermove', { x: Math.max(1, catalogRect.left - 12), y: catalogRect.top + catalogRect.height / 2 });
      pointer(doc, 'pointermove', destination);
      pointer(doc, 'pointerup', destination);
    };

    const dragCatalogResultTo = (doc, result, target) => dragCatalogResultToPoint(doc, result, center(target));

    const reloadWorkbench = (frame) => new Promise((resolve, reject) => {
      frame.addEventListener('load', async () => {
        try {
          frame.contentDocument.body.style.margin = '0';
          await nextFrame(frame.contentWindow);
          resolve(frame);
        } catch (error) {
          reject(error);
        }
      }, { once: true });
      frame.contentWindow.location.reload();
    });

    const run = async (name, test, options = 900) => {
      const normalized = typeof options === 'number' ? { height: options } : options;
      const frame = await loadWorkbench(normalized);
      try {
        await test(frame.contentDocument, frame.contentWindow, frame);
        return { name, passed: true };
      } catch (error) {
        return { name, passed: false, error: error.message };
      } finally {
        if (normalized.persistenceKey) {
          frame.contentWindow.localStorage.removeItem(`sonder.mock.panels.v1.${normalized.persistenceKey}`);
        }
        frame.remove();
      }
    };

    const runPreview = async (name, test, options = 900) => {
      const normalized = typeof options === 'number' ? { height: options } : options;
      let frame = null;
      try {
        const loaded = await loadPreview(normalized);
        frame = loaded.frame;
        await test(loaded.previewDocument, loaded.previewWindow, loaded.previewFrame);
        return { name, passed: true };
      } catch (error) {
        return { name, passed: false, error: error.message };
      } finally {
        frame?.remove();
      }
    };

    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };

    const captureWidgetOrigin = (module) => {
      const group = module.closest('.sonder-widget-group');
      const parent = module.parentElement;
      const rect = module.getBoundingClientRect();
      return {
        group,
        groupParent: group?.parentElement || null,
        groupIndex: group ? Array.from(group.parentElement?.children || []).filter((child) => child.classList.contains('sonder-widget-group')).indexOf(group) : -1,
        parent,
        parentIndex: parent ? Array.from(parent.children).indexOf(module) : -1,
        stableClasses: Array.from(module.classList).filter((name) => name !== 'is-tab-active').sort().join(' '),
        inlineStyle: module.getAttribute('style'),
        rect: { left: rect.left, top: rect.top, width: rect.width, height: rect.height }
      };
    };

    const assertWidgetRestored = (module, origin, label) => {
      const rect = module.getBoundingClientRect();
      const close = (actual, expected) => Math.abs(actual - expected) <= 1;
      assert(module.closest('.sonder-widget-group') === origin.group, `${label} returned to a different Widget group`);
      if (origin.group) {
        assert(origin.group.parentElement === origin.groupParent, `${label} returned to a different layout owner`);
        const groupIndex = Array.from(origin.group.parentElement?.children || []).filter((child) => child.classList.contains('sonder-widget-group')).indexOf(origin.group);
        assert(groupIndex === origin.groupIndex, `${label} returned at layout position ${groupIndex} instead of ${origin.groupIndex}`);
      } else {
        assert(module.parentElement === origin.parent, `${label} returned to a different direct parent`);
        const parentIndex = Array.from(origin.parent?.children || []).indexOf(module);
        assert(parentIndex === origin.parentIndex, `${label} returned at direct position ${parentIndex} instead of ${origin.parentIndex}`);
      }
      const stableClasses = Array.from(module.classList).filter((name) => name !== 'is-tab-active').sort().join(' ');
      assert(stableClasses === origin.stableClasses, `${label} returned with classes ${JSON.stringify(stableClasses)} instead of ${JSON.stringify(origin.stableClasses)}`);
      assert(
        module.getAttribute('style') === origin.inlineStyle,
        `${label} retained temporary drag geometry: expected ${JSON.stringify(origin.inlineStyle)}, received ${JSON.stringify(module.getAttribute('style'))}`
      );
      assert(close(rect.left, origin.rect.left) && close(rect.top, origin.rect.top), `${label} returned at ${Math.round(rect.left)},${Math.round(rect.top)} instead of ${Math.round(origin.rect.left)},${Math.round(origin.rect.top)}`);
      assert(close(rect.width, origin.rect.width) && close(rect.height, origin.rect.height), `${label} returned at ${Math.round(rect.width)}x${Math.round(rect.height)} instead of its original size`);
      assert(!module.classList.contains('is-dragging'), `${label} remained in the dragging state`);
    };

    const commandWidget = (doc, widgetId, command) => {
      const action = doc.querySelector(`[data-widget-actions="${widgetId}"]`);
      assert(action, `No action menu was available for ${widgetId}`);
      action.click();
      const item = doc.querySelector(`[data-widget-command="${command}"]`);
      assert(item, `No ${command} command was available for ${widgetId}`);
      item.click();
    };

    const groupIds = (doc, side) => Array.from(doc.querySelector(`[data-dock-stack="${side}"]`).children)
      .filter((child) => child.classList.contains('sonder-widget-group'))
      .map((group) => Array.from(group.querySelectorAll(':scope > .sonder-module')).map((module) => module.dataset.widgetId).join('+'));

    const documentedWidgetTypes = Object.freeze([
      'story.transcript', 'story.composer', 'story.context', 'story.turn-progress',
      'story.live-technical-detail', 'story.turn-versions', 'story.turn-inspector',
      'story.player-condition', 'story.cast-condition', 'story.room-ambience',
      'story.scene-backdrop', 'runtime.background-work',
      'library.workspace', 'library.stories', 'library.characters', 'story.characters',
      'library.personas', 'story.personas', 'library.lore', 'story.lorebooks',
      'library.new-story', 'library.character-card', 'story.character-card',
      'library.persona-card', 'library.greetings-quick-start', 'library.lore-entries',
      'library.lore-entry-editor', 'library.lorebook-details',
      'library.lore-relationships', 'library.lore-generator',
      'library.lived-location-builder',
      'systems.cast', 'systems.background-presences', 'systems.world-state',
      'systems.attire', 'systems.genre-style', 'systems.dialogue-agency',
      'systems.offscreen-life', 'systems.living-world',
      'systems.institutions-charter', 'systems.institution-diagnostics',
      'systems.background-life', 'systems.character-relationships',
      'systems.memory-browser', 'systems.character-private-history',
      'systems.persona-private-history', 'systems.dramatic-irony',
      'systems.promise-ledger', 'systems.multiplayer-invites', 'systems.frames',
      'systems.whos-where', 'systems.paradox-fixed-points',
      'settings.group.account-access', 'settings.group.ai-models',
      'settings.group.appearance-accessibility', 'settings.group.story-content',
      'settings.group.data-extensions-maintenance', 'settings.group.advanced',
      'settings.provider-credentials', 'settings.model-assignments', 'settings.theme',
      'settings.reading-layout', 'settings.sound-motion', 'settings.accessibility',
      'settings.content', 'settings.add-ons', 'settings.maintenance',
      'settings.prompt-editor', 'settings.raw-story-data'
    ]);

    const documentedSettingsSubwidgetTypes = Object.freeze([
      'settings.connections', 'settings.default-model', 'settings.memory-search-model',
      'settings.response-limit', 'settings.openrouter-routing',
      'settings.scene-backdrops', 'settings.room-ambience', 'settings.custom-theme',
      'settings.story-reading-layout', 'settings.story-sound',
      'settings.accessibility-controls', 'settings.content-preferences',
      'settings.narrator-voice', 'settings.living-world-controls',
      'settings.installed-extensions', 'settings.install-extension',
      'settings.sonder-updates', 'settings.checkpoint-storage',
      'settings.memory-search-repair', 'settings.diagnostics',
      'settings.prompt-preset-editor', 'settings.raw-clothing-data'
    ]);

    const requiredViewportRuns = [
      [1600, 900], [1180, 800], [1024, 768], [768, 1024],
      [430, 932], [390, 844], [844, 390], [1024, 600], [800, 450]
    ].map(([width, height], index) => run(`${index === 8 ? '200% zoom equivalent' : 'Required viewport'} ${width}×${height} preserves the workbench and Catalog`, async (doc, view) => {
      const root = doc.getElementById('sonder-calibration');
      const windowShell = doc.querySelector('.sonder-window');
      assert(root && windowShell, 'Workbench shell is absent');
      assert(doc.documentElement.scrollWidth <= view.innerWidth + 1, `Document overflows horizontally by ${doc.documentElement.scrollWidth - view.innerWidth}px`);
      assert(doc.documentElement.scrollHeight <= view.innerHeight + 2, `Document overflows vertically by ${doc.documentElement.scrollHeight - view.innerHeight}px`);
      const shellRect = windowShell.getBoundingClientRect();
      assert(shellRect.left >= -1 && shellRect.right <= view.innerWidth + 1, 'Workbench shell escaped the viewport');
      assert(shellRect.top >= -1 && shellRect.bottom <= view.innerHeight + 2, 'Workbench shell escaped the viewport height');
      doc.querySelector('[data-widget-catalog-launcher]').click();
      const catalog = doc.querySelector('[data-widget-catalog]');
      const catalogRect = catalog.getBoundingClientRect();
      assert(!catalog.hidden && catalogRect.width > 0 && catalogRect.height > 0, 'Catalog did not open');
      assert(catalogRect.left >= -1 && catalogRect.right <= view.innerWidth + 1 && catalogRect.top >= -1 && catalogRect.bottom <= view.innerHeight + 1, 'Catalog escaped the viewport');
      assert(doc.querySelector('[data-catalog-search]') && doc.querySelector('[data-catalog-close]') && doc.querySelector('[data-catalog-category="all"]'), 'Catalog lost search, Close, or category recovery controls');
      assert(doc.documentElement.scrollWidth <= view.innerWidth + 1, 'Open Catalog caused horizontal document overflow');
    }, { width, height }));

    Promise.all([
      ...requiredViewportRuns,
      run('Accessibility preview preserves solid, contrast, reduced-motion, focus, and large-target contracts', async (doc, view) => {
        const api = view.SonderWidgetMockup;
        assert(typeof api?.setAccessibilityPreview === 'function', 'Accessibility preview API is absent');
        api.setAccessibilityPreview({ solid: true, highContrast: true, reducedMotion: true, largeTargets: true });
        const root = doc.getElementById('sonder-calibration');
        assert(root.dataset.solidSurfaces === 'true' && root.dataset.highContrast === 'true' && root.dataset.reducedMotion === 'true' && root.dataset.largeTargets === 'true', 'Accessibility modes were not applied together');
        const module = doc.querySelector('.sonder-module');
        const moduleStyle = view.getComputedStyle(module);
        assert(moduleStyle.backdropFilter === 'none', 'Solid surfaces left module blur active');
        const action = doc.querySelector('[data-widget-actions]');
        assert(action.getBoundingClientRect().height >= 44, `Large-target mode left ${action.className || action.tagName} at ${action.getBoundingClientRect().height}px (min ${view.getComputedStyle(action).minHeight}, height ${view.getComputedStyle(action).height})`);
        assert(view.getComputedStyle(action).transitionDuration === '0s', 'Reduced-motion mode left structural transition duration active');
        action.focus();
        const focusStyle = view.getComputedStyle(action);
        assert(focusStyle.outlineStyle !== 'none' && Number.parseFloat(focusStyle.outlineWidth) >= 2, 'High-contrast focus indication is not explicit');
      }, { width: 1024, height: 768 }),
      run('Workbench fills the usable browser height', async (doc, view) => {
        const workbench = doc.querySelector('.sonder-window');
        assert(workbench, 'Workbench window was not rendered');
        const bottomGap = Math.abs(view.innerHeight - workbench.getBoundingClientRect().bottom);
        assert(bottomGap <= 2, `Workbench leaves ${Math.round(bottomGap)}px of unused vertical space`);
      }),
      run('Top shelf exposes Panel tabs, New Panel, and trailing Widgets', async (doc) => {
        const tabs = Array.from(doc.querySelectorAll('[data-panel-tab]'));
        const create = doc.querySelector('[data-panel-create]');
        const widgets = doc.querySelector('[data-widget-catalog-launcher]');
        const status = doc.querySelector('.sonder-status');
        assert(tabs.map((tab) => tab.textContent.trim()).join(',') === 'Scene,Library,Settings', 'Shipped Panel tabs are not Scene, Library, Settings');
        assert(create?.getAttribute('aria-label') === 'Create Panel', 'New Panel control is missing');
        assert(widgets && status && widgets.nextElementSibling === status, 'Widgets is not immediately before status');
        assert(doc.querySelectorAll('.sonder-nav-cell').length === 0, 'Fixed destination cells still exist');
      }),
      run('Panel activation changes active identity without changing the story', async (doc) => {
        const root = doc.getElementById('sonder-calibration');
        const story = doc.querySelector('.sonder-story-lockup strong').textContent;
        doc.querySelector('[data-panel-tab="panel-library"]').click();
        assert(root.dataset.activePanel === 'panel-library', 'Library Panel did not activate');
        assert(doc.querySelector('[data-panel-tab="panel-library"]').getAttribute('aria-selected') === 'true', 'Active Panel tab is not selected');
        assert(doc.querySelector('.sonder-story-lockup strong').textContent === story, 'Panel switch changed active-story identity');
      }),
      run('Panel action menu opens against its top-shelf trigger', async (doc) => {
        doc.querySelector('[data-panel-tab="panel-settings"]').click();
        const trigger = doc.querySelector('[data-panel-more]');
        trigger.click();
        const menu = doc.querySelector('[data-panel-menu]');
        const triggerRect = trigger.getBoundingClientRect();
        const menuRect = menu.getBoundingClientRect();
        const gap = menuRect.top - triggerRect.bottom;
        assert(!menu.hidden, 'Panel action menu did not open');
        assert(gap >= 2 && gap <= 6, `Panel action menu opened ${Math.round(gap)}px below its trigger`);
      }),
      run('Dragging an inactive Panel reorders it without activating it', async (doc) => {
        const root = doc.getElementById('sonder-calibration');
        const settings = doc.querySelector('[data-panel-tab="panel-settings"]');
        const scene = doc.querySelector('[data-panel-tab="panel-scene"]');
        beginPanelTabDrag(doc, settings);
        assert(root.classList.contains('is-panel-tab-reordering'), 'Panel did not lift after crossing the drag threshold');
        assert(root.dataset.activePanel === 'panel-scene', 'Dragging Settings activated it');
        const sceneRect = scene.getBoundingClientRect();
        pointer(doc, 'pointermove', { x: sceneRect.left + 2, y: center(scene).y });
        assert(doc.querySelector('[data-panel-tab-insertion]'), 'Panel insertion marker was not rendered');
        pointer(doc, 'pointerup', { x: sceneRect.left + 2, y: center(scene).y });
        assert(panelTabOrder(doc) === 'Settings,Scene,Library', `Panel order became ${panelTabOrder(doc)}`);
        assert(root.dataset.activePanel === 'panel-scene', 'Dropping Settings activated it');
        assert(doc.querySelector('[data-panel-more]') === doc.querySelector('[data-panel-tabs]').lastElementChild, 'Active Panel menu moved into the reorderable tabs');
      }),
      run('Reordered Panel sequence persists after reload', async (doc, view, frame) => {
        const library = doc.querySelector('[data-panel-tab="panel-library"]');
        const scene = doc.querySelector('[data-panel-tab="panel-scene"]');
        beginPanelTabDrag(doc, library);
        const sceneRect = scene.getBoundingClientRect();
        pointer(doc, 'pointermove', { x: sceneRect.left + 2, y: center(scene).y });
        pointer(doc, 'pointerup', { x: sceneRect.left + 2, y: center(scene).y });
        assert(panelTabOrder(doc) === 'Library,Scene,Settings', 'Panel did not reorder before reload');
        await reloadWorkbench(frame);
        assert(panelTabOrder(frame.contentDocument) === 'Library,Scene,Settings', `Reloaded order is ${panelTabOrder(frame.contentDocument)}`);
      }, { persistenceKey: `panel-reorder-${Date.now()}-${Math.random()}` }),
      run('Escape cancels an in-progress Panel reorder', async (doc) => {
        const library = doc.querySelector('[data-panel-tab="panel-library"]');
        const scene = doc.querySelector('[data-panel-tab="panel-scene"]');
        beginPanelTabDrag(doc, library);
        assert(doc.getElementById('sonder-calibration').classList.contains('is-panel-tab-reordering'), 'Panel reorder did not begin before Escape');
        pointer(doc, 'pointermove', { x: scene.getBoundingClientRect().left + 2, y: center(scene).y });
        doc.dispatchEvent(new doc.defaultView.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        assert(panelTabOrder(doc) === 'Scene,Library,Settings', `Escape left order ${panelTabOrder(doc)}`);
        assert(!doc.getElementById('sonder-calibration').classList.contains('is-panel-tab-reordering'), 'Escape left Panel reorder active');
        assert(!doc.querySelector('[data-panel-tab-drag-proxy]'), 'Escape left the dragged Panel proxy visible');
      }),
      run('Dropping outside the Panel strip cancels the reorder', async (doc) => {
        const library = doc.querySelector('[data-panel-tab="panel-library"]');
        const scene = doc.querySelector('[data-panel-tab="panel-scene"]');
        const strip = doc.querySelector('[data-panel-tabs]').getBoundingClientRect();
        beginPanelTabDrag(doc, library);
        assert(doc.getElementById('sonder-calibration').classList.contains('is-panel-tab-reordering'), 'Panel reorder did not begin before the outside drop');
        pointer(doc, 'pointermove', { x: scene.getBoundingClientRect().left + 2, y: center(scene).y });
        pointer(doc, 'pointerup', { x: scene.getBoundingClientRect().left + 2, y: strip.bottom + 80 });
        assert(panelTabOrder(doc) === 'Scene,Library,Settings', `Outside drop left order ${panelTabOrder(doc)}`);
      }),
      run('Keyboard reordering moves the focused Panel and preserves focus', async (doc) => {
        const settings = doc.querySelector('[data-panel-tab="panel-settings"]');
        settings.focus();
        settings.dispatchEvent(new doc.defaultView.KeyboardEvent('keydown', { key: 'ArrowLeft', ctrlKey: true, shiftKey: true, bubbles: true }));
        const moved = doc.querySelector('[data-panel-tab="panel-settings"]');
        assert(panelTabOrder(doc) === 'Scene,Settings,Library', `Keyboard order became ${panelTabOrder(doc)}`);
        assert(doc.activeElement === moved, 'Focus did not follow the keyboard-moved Panel');
        assert(doc.getElementById('sonder-calibration').dataset.activePanel === 'panel-scene', 'Keyboard reorder activated Settings');
        assert(doc.querySelector('[data-widget-announcement]').textContent.includes('Settings moved before Library'), 'Keyboard reorder was not announced');
      }),
      run('New Panel creates a named three-column Panel and activates it', async (doc) => {
        doc.querySelector('[data-panel-create]').click();
        const dialog = doc.querySelector('[data-panel-dialog]');
        assert(dialog && !dialog.hidden, 'New Panel dialog did not open');
        dialog.querySelector('[data-panel-name]').value = 'Director Desk';
        dialog.querySelector('[data-template-choice="columns.v1"]').click();
        dialog.querySelector('[data-column-count="3"]').click();
        dialog.querySelector('[data-create-panel]').click();
        const active = doc.querySelector('[data-panel-tab][aria-selected="true"]');
        assert(active?.textContent.trim() === 'Director Desk', 'Created Panel did not become active');
        assert(doc.getElementById('sonder-calibration').dataset.panelTemplate === 'columns', 'Created Panel did not use column layout');
        assert(doc.getElementById('sonder-calibration').dataset.panelColumns === '3', 'Created Panel did not retain three columns');
      }),
      run('Panel dialog offers story stage, focus support, and two through six columns', async (doc) => {
        doc.querySelector('[data-panel-create]').click();
        const dialog = doc.querySelector('[data-panel-dialog]');
        assert(dialog.querySelector('[data-template-choice="story-stage.v1"]'), 'Story-stage template is absent');
        assert(dialog.querySelector('[data-template-choice="focus-support.v1"]'), 'Focus-support template is absent');
        const columns = Array.from(dialog.querySelectorAll('[data-column-count]')).map((item) => item.dataset.columnCount);
        assert(columns.join(',') === '2,3,4,5,6', `Column choices are ${columns.join(',')}`);
      }),
      run('Registry exposes the complete documented Widget model', async (doc, view) => {
        const api = view.SonderWidgetMockup;
        assert(api, 'The test inspection API is absent');
        assert(api.builtInDefinitions.length === 91, `Built-in count is ${api.builtInDefinitions.length}, not 91`);
        assert(api.extensionDefinitions.length === 3, `Extension count is ${api.extensionDefinitions.length}, not 3`);
        assert(api.catalogDefinitions.length === 94, `Catalog count is ${api.catalogDefinitions.length}, not 94`);
        assert(api.embeddedInspectorRenderers.length === 1, 'The extension Inspector renderer is absent');
        assert(!api.catalogDefinitions.some((item) => item.type === 'settings.host-session'), 'Host session was registered as a Widget');
        assert(doc.getElementById('sonder-calibration').dataset.widgetDefinitionCount === '94', 'Rendered definition count is not 94');
      }),
      run('Registry contains every fixed Widget and approved Settings subwidget', async (doc, view) => {
        const api = view.SonderWidgetMockup;
        assert(api, 'The test inspection API is absent');
        const types = new Set(api.builtInDefinitions.map((item) => item.type));
        documentedWidgetTypes.forEach((type) => assert(types.has(type), `${type} is absent from the fixed inventory`));
        documentedSettingsSubwidgetTypes.forEach((type) => assert(types.has(type), `${type} is absent from the Settings subwidget inventory`));
        assert(documentedWidgetTypes.length === 69, 'Fixed inventory fixture no longer has 69 types');
        assert(documentedSettingsSubwidgetTypes.length === 22, 'Settings subwidget fixture no longer has 22 types');
      }),
      run('Registry types are unique and preserve documented category totals', async (doc, view) => {
        const api = view.SonderWidgetMockup;
        assert(api, 'The test inspection API is absent');
        const types = api.catalogDefinitions.map((item) => item.type);
        assert(new Set(types).size === types.length, 'Catalog contains duplicate Widget types');
        const totals = api.catalogDefinitions.reduce((counts, item) => {
          counts[item.category] = (counts[item.category] || 0) + 1;
          return counts;
        }, {});
        assert(JSON.stringify(totals) === JSON.stringify({ story: 12, library: 19, systems: 21, settings: 39, extensions: 3 }), `Category totals are ${JSON.stringify(totals)}`);
      }),
      run('Every Widget and collection action resolves to a manifest-backed CC0 SVG', async (doc, view) => {
        const api = view.SonderWidgetMockup;
        assert(api, 'The test inspection API is absent');
        [...api.builtInDefinitions, ...api.extensionDefinitions].forEach((definition) => {

        const target = { x: rect.left + rect.width / 2, y: rect.top + rect.height * .18 };
        beginDrag(doc, sourceTab);
        pointer(doc, 'pointermove', target);
        const aboveRail = doc.querySelector('[data-drop-rail][data-drop-side="left"][data-drop-index="0"]');
        assert(aboveRail?.classList.contains('is-active'), 'The top quarter did not activate Shelf above');
        pointer(doc, 'pointerup', target);
        assert(groupIds(doc, 'left').join(',') === 'scene-ambience,scene-characters,scene-theme', `Top-quarter placement produced ${groupIds(doc, 'left').join(',')}`);
      }, 900),
      run('Shelf intent does not flicker at a quarter boundary', async (doc) => {
        const sourceTab = doc.querySelector('[data-group-tab="scene-ambience"]');
        const characters = doc.querySelector('[data-widget-id="scene-characters"]').closest('.sonder-widget-group');
        assert(sourceTab && characters, 'Required Widget intent fixtures were not rendered');
        const rect = characters.getBoundingClientRect();
        const titleRect = characters.querySelector('[data-widget-drag-surface]').getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const boundary = titleRect.bottom + (rect.bottom - titleRect.bottom) * .75;
        beginDrag(doc, sourceTab);
        pointer(doc, 'pointermove', { x, y: boundary + 16 });
        const rail = doc.querySelector('[data-drop-rail][data-drop-side="left"][data-drop-index="1"]');
        assert(rail?.classList.contains('is-active'), 'Shelf below did not activate before the stability check');
        pointer(doc, 'pointermove', { x, y: boundary - 5 });
        assert(rail.classList.contains('is-active'), 'Shelf intent flickered immediately after crossing the quarter boundary');
        pointer(doc, 'pointermove', { x, y: boundary - 12 });
        assert(!rail.classList.contains('is-active') && characters.classList.contains('is-tab-drop-target'), 'Shelf intent did not yield after the stability margin');
      }, 900),
      run('Shelf below feedback stays outside footer controls', async (doc) => {
        commandWidget(doc, 'scene-theme', 'float');
        const sourceTab = doc.querySelector('[data-group-tab="scene-ambience"]');
        const characters = doc.querySelector('[data-widget-id="scene-characters"]').closest('.sonder-widget-group');
        const footer = characters?.querySelector('.sonder-roster-scale');
        assert(sourceTab && characters && footer, 'Required footer collision fixtures were not rendered');
        beginDrag(doc, sourceTab);
        const rail = doc.querySelector('[data-drop-rail][data-drop-side="left"][data-drop-index="1"]');
        const railRect = rail.getBoundingClientRect();
        const footerRect = footer.getBoundingClientRect();
        assert(railRect.top >= footerRect.bottom - 1, `Shelf below begins at ${Math.round(railRect.top)}px before the footer ends at ${Math.round(footerRect.bottom)}px`);
        const charactersRect = characters.getBoundingClientRect();
        pointer(doc, 'pointermove', { x: charactersRect.left + charactersRect.width / 2, y: charactersRect.top + charactersRect.height * .82 });
        const ghost = doc.querySelector('[data-snap-ghost]');
        const ghostRect = ghost.getBoundingClientRect();
        assert(!ghost.hidden && ghostRect.top >= footerRect.bottom - 1, `Shelf below preview begins at ${Math.round(ghostRect.top)}px before the footer ends at ${Math.round(footerRect.bottom)}px`);
      }, 900),
      run('A constrained Shelf below preview never falls back over footer controls', async (doc, view) => {
        commandWidget(doc, 'scene-theme', 'float');
        const sourceTab = doc.querySelector('[data-group-tab="scene-ambience"]');
        const characters = doc.querySelector('[data-widget-id="scene-characters"]').closest('.sonder-widget-group');
        const footer = characters?.querySelector('.sonder-roster-scale');
        const dock = characters?.closest('[data-dock]');
        assert(sourceTab && characters && footer && dock, 'Required constrained footer fixtures were not rendered');
        characters.style.flex = '0 0 calc(100% - 14px)';
        await nextFrame(view);
        const charactersRect = characters.getBoundingClientRect();
        const dockRect = dock.getBoundingClientRect();
        assert(dockRect.bottom - charactersRect.bottom < 72, 'The footer fixture did not exercise the constrained preview fallback');
        beginDrag(doc, sourceTab);
        pointer(doc, 'pointermove', { x: charactersRect.left + charactersRect.width / 2, y: charactersRect.top + charactersRect.height * .82 });
        const ghost = doc.querySelector('[data-snap-ghost]');
        const ghostRect = ghost.getBoundingClientRect();
        const footerRect = footer.getBoundingClientRect();
        assert(!ghost.hidden, 'The constrained Shelf below preview disappeared');
        assert(ghostRect.top >= footerRect.bottom - 1, `Constrained preview begins at ${Math.round(ghostRect.top)}px before the footer ends at ${Math.round(footerRect.bottom)}px`);
        assert(ghostRect.bottom <= dockRect.bottom + 1, `Constrained preview ends at ${Math.round(ghostRect.bottom)}px beyond the dock at ${Math.round(dockRect.bottom)}px`);
      }, 900),
      run('Open space below a populated dock previews at the append edge', async (doc, view) => {
        commandWidget(doc, 'scene-theme', 'float');
        const sourceTab = doc.querySelector('[data-group-tab="scene-ambience"]');
        const characters = doc.querySelector('[data-widget-id="scene-characters"]').closest('.sonder-widget-group');
        const dock = characters?.closest('[data-dock]');
        assert(sourceTab && characters && dock, 'Required populated append fixtures were not rendered');
        characters.style.flex = '0 0 300px';
        await nextFrame(view);
        const charactersRect = characters.getBoundingClientRect();
        const dockRect = dock.getBoundingClientRect();
        const target = { x: charactersRect.left + charactersRect.width / 2, y: dockRect.bottom - 24 };
        assert(target.y > charactersRect.bottom, 'The append fixture did not leave open dock space below the final shelf');
        beginDrag(doc, sourceTab);
        pointer(doc, 'pointermove', target);
        const ghost = doc.querySelector('[data-snap-ghost]');
        const ghostRect = ghost.getBoundingClientRect();
        assert(!ghost.hidden, 'The populated append preview disappeared');
        assert(ghostRect.top >= charactersRect.bottom - 1, `Append preview began at ${Math.round(ghostRect.top)}px above the final shelf edge at ${Math.round(charactersRect.bottom)}px`);
        pointer(doc, 'pointerup', target);
        assert(groupIds(doc, 'left').join(',') === 'scene-characters,scene-ambience', `Open-space append produced ${groupIds(doc, 'left').join(',')}`);
      }, 900),
      run('Dragging a tab left reshuffles it before its neighbor', async (doc) => {
        const connectionsTab = doc.querySelector('[data-group-tab="scene-promises"]');
        const personasTab = doc.querySelector('[data-group-tab="scene-ambience"]');
        assert(connectionsTab && personasTab, 'Required tabs were not rendered');
        const targetRect = personasTab.getBoundingClientRect();
        beginDrag(doc, connectionsTab);
        const target = { x: targetRect.left + 4, y: targetRect.top + targetRect.height / 2 };
        pointer(doc, 'pointermove', target);
        pointer(doc, 'pointerup', target);
        const group = doc.querySelector('[data-widget-id="scene-promises"]').closest('.sonder-widget-group');
        const order = Array.from(group.querySelectorAll('[data-group-tab]')).map((tab) => tab.dataset.groupTab);
        assert(order.join(',') === 'scene-promises,scene-ambience', `Expected Promise Ledger before Room Ambience, got ${order.join(',')}`);
      }),
      run('A three-tab strip accepts a precise middle-tab insertion', async (doc) => {
        const personasTab = doc.querySelector('[data-group-tab="scene-ambience"]');
        const effectsHead = doc.querySelector('[data-widget-id="scene-world"] [data-widget-drag-surface]');
        assert(personasTab && effectsHead, 'Initial tab transfer handles were not rendered');
        beginDrag(doc, personasTab);
        const effectsTarget = center(effectsHead);
        pointer(doc, 'pointermove', effectsTarget);
        pointer(doc, 'pointerup', effectsTarget);

        const connectionsHead = doc.querySelector('[data-widget-id="scene-promises"] [data-widget-drag-surface]');
        const effectsGroup = doc.querySelector('[data-widget-id="scene-world"]').closest('.sonder-widget-group');
        const currentTabs = Array.from(effectsGroup.querySelectorAll('[data-group-tab]'));
        assert(connectionsHead && currentTabs.length === 2, 'The three-tab setup did not reach its intermediate state');
        const finalTabRect = currentTabs.at(-1).getBoundingClientRect();
        beginDrag(doc, connectionsHead);
        const appendTarget = { x: finalTabRect.right - 2, y: finalTabRect.top + finalTabRect.height / 2 };
        pointer(doc, 'pointermove', appendTarget);
        pointer(doc, 'pointerup', appendTarget);

        const middleTab = doc.querySelector('[data-group-tab="scene-ambience"]');
        const firstTab = doc.querySelector('[data-group-tab="scene-world"]');
        assert(middleTab && firstTab, 'The three-tab strip was not created');
        const firstRect = firstTab.getBoundingClientRect();
        beginDrag(doc, middleTab);
        const reorderTarget = { x: firstRect.left + 3, y: firstRect.top + firstRect.height / 2 };
        pointer(doc, 'pointermove', reorderTarget);
        pointer(doc, 'pointerup', reorderTarget);

        const reorderedGroup = doc.querySelector('[data-widget-id="scene-world"]').closest('.sonder-widget-group');
        const order = Array.from(reorderedGroup.querySelectorAll('[data-group-tab]')).map((tab) => tab.dataset.groupTab);
        assert(order.join(',') === 'scene-ambience,scene-world,scene-promises', `Expected Room Ambience, World State, Promise Ledger; got ${order.join(',')}`);
      }),
      run('Returning from a shelf rail to the title bar resolves as a tab', async (doc) => {
        const personasTab = doc.querySelector('[data-group-tab="scene-ambience"]');
        const effectsHead = doc.querySelector('[data-widget-id="scene-world"] [data-widget-drag-surface]');
        assert(personasTab && effectsHead, 'Required widget handles were not rendered');
        const headRect = effectsHead.getBoundingClientRect();
        const target = center(effectsHead);
        beginDrag(doc, personasTab);
        pointer(doc, 'pointermove', { x: target.x, y: headRect.top + 5 });
        pointer(doc, 'pointermove', target);
        pointer(doc, 'pointerup', target);
        const effectsGroup = doc.querySelector('[data-widget-id="scene-world"]').closest('.sonder-widget-group');
        assert(effectsGroup.querySelector('[data-widget-id="scene-ambience"]'), 'A previously entered shelf rail overrode the final title-bar target');
      }, 1440),
      run('Every toolbar boundary exposes an explicit insertion seam', async (doc) => {
        const personasTab = doc.querySelector('[data-group-tab="scene-ambience"]');
        assert(personasTab, 'Room Ambience tab was not rendered');
        beginDrag(doc, personasTab);
        const leftGroups = groupIds(doc, 'left');
        const leftRails = Array.from(doc.querySelectorAll('[data-drop-rail]')).filter((item) => item.dataset.dropSide === 'left');
        assert(leftRails.length === leftGroups.length + 1, `Expected ${leftGroups.length + 1} insertion seams, got ${leftRails.length}`);
        assert(leftRails.map((rail) => rail.dataset.dropIndex).join(',') === '0,1,2', 'Insertion seams were not ordered before, between, and after the shelves');
      }, 900),
      run('Separating a merged tab always creates another shelf', async (doc) => {
        commandWidget(doc, 'scene-ambience', 'separate');
        const personasGroup = doc.querySelector('[data-widget-id="scene-ambience"]').closest('.sonder-widget-group');
        const connectionsGroup = doc.querySelector('[data-widget-id="scene-promises"]').closest('.sonder-widget-group');
        assert(personasGroup !== connectionsGroup, 'Room Ambience remained trapped in the merged tab group');
        assert(groupIds(doc, 'right').join(',') === 'scene-world,scene-promises,scene-ambience', `Unexpected shelf order after separation: ${groupIds(doc, 'right').join(',')}`);
      }, 900),
      run('Menu docking adds a shelf even when the destination is populated', async (doc) => {
        commandWidget(doc, 'scene-world', 'left');
        const effectsDock = doc.querySelector('[data-widget-id="scene-world"]').closest('[data-dock]');
        assert(effectsDock?.dataset.dock === 'left', 'World State was refused by the populated left toolbar');
        assert(groupIds(doc, 'left').join(',') === 'scene-characters,scene-theme,scene-world', 'World State was not appended as an ordered shelf');
      }, 900),
      run('Legacy Widget Shelf controls are retired in favor of Catalog and Remove', async (doc) => {
        assert(!doc.querySelector('[data-widget-shelf-open]'), 'A side Shelf launcher is still exposed');
        assert(!doc.querySelector('[data-widget-command="shelf"]'), 'The legacy Shelf command is still exposed');
        assert(!doc.body.innerText.includes('Widget Shelf'), 'Legacy Shelf copy remains visible');
        assert(doc.querySelector('[data-widget-catalog-launcher]'), 'The replacement Catalog launcher is absent');
        assert(doc.querySelector('[data-widget-command="remove"]'), 'Remove from Panel is absent');
      }, 900),
      run('Dropping on a middle seam inserts between neighboring shelves', async (doc) => {
        const personasTab = doc.querySelector('[data-group-tab="scene-ambience"]');
        assert(personasTab, 'Room Ambience tab was not rendered');
        beginDrag(doc, personasTab);
        const rail = doc.querySelector('[data-drop-rail][data-drop-side="left"][data-drop-index="1"]');
        assert(rail, 'The middle insertion seam was not exposed');
        const target = center(rail);
        pointer(doc, 'pointermove', target);
        assert(rail.classList.contains('is-active'), 'Shelf rail did not clearly activate under the pointer');
        pointer(doc, 'pointerup', target);
        assert(groupIds(doc, 'left').join(',') === 'scene-characters,scene-ambience,scene-theme', `Middle insertion produced ${groupIds(doc, 'left').join(',')}`);
      }, 900),
      run('Settings invalid release restores the exact Widget origin', async (doc) => {
        doc.querySelector('[data-panel-tab="panel-settings"]').click();
        const module = doc.querySelector('[data-widget-id="settings-providers"]');
        const handle = module?.querySelector('[data-widget-drag-surface]');
        const surface = doc.querySelector('[data-panel-surface]');
        assert(module && handle && surface, 'Settings drag fixtures were not rendered');
        const origin = captureWidgetOrigin(module);
        beginDrag(doc, handle);
        const target = center(surface);
        pointer(doc, 'pointermove', target);
        pointer(doc, 'pointerup', target);
        assertWidgetRestored(module, origin, 'Provider Credentials');
      }),
      run('Library Escape restores the exact Widget origin', async (doc) => {
        doc.querySelector('[data-panel-tab="panel-library"]').click();
        const module = doc.querySelector('[data-widget-id="library-main"]');
        const handle = module?.querySelector('[data-widget-drag-surface]');
        assert(module && handle, 'Library drag fixtures were not rendered');
        const origin = captureWidgetOrigin(module);
        beginDrag(doc, handle);
        pointer(doc, 'pointermove', { x: doc.defaultView.innerWidth - 24, y: doc.defaultView.innerHeight - 24 });
        doc.dispatchEvent(new doc.defaultView.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        assertWidgetRestored(module, origin, 'Library');
      }),
      run('Scene invalid release restores the exact docked Widget origin', async (doc) => {
        const module = doc.querySelector('[data-widget-id="scene-world"]');
        const handle = module?.querySelector('[data-widget-drag-surface]');
        const panelTab = doc.querySelector('[data-panel-tab="panel-scene"]');
        assert(module && handle && panelTab, 'Scene drag fixtures were not rendered');
        const origin = captureWidgetOrigin(module);
        beginDrag(doc, handle);
        const target = center(panelTab);
        pointer(doc, 'pointermove', target);
        pointer(doc, 'pointerup', target);
        assertWidgetRestored(module, origin, 'World State');
      }),
      run('Pointer cancellation restores the exact Widget origin', async (doc) => {
        doc.querySelector('[data-panel-tab="panel-settings"]').click();
        const module = doc.querySelector('[data-widget-id="settings-providers"]');
        const handle = module?.querySelector('[data-widget-drag-surface]');
        assert(module && handle, 'Pointer-cancel drag fixtures were not rendered');
        const origin = captureWidgetOrigin(module);
        beginDrag(doc, handle);
        pointer(doc, 'pointermove', { x: doc.defaultView.innerWidth / 2, y: doc.defaultView.innerHeight / 2 });
        pointer(doc, 'pointercancel', { x: doc.defaultView.innerWidth / 2, y: doc.defaultView.innerHeight / 2 });
        assertWidgetRestored(module, origin, 'Pointer-cancelled Provider Credentials');
      }),
      run('Floating invalid release preserves custom geometry', async (doc, view) => {
        const module = doc.querySelector('[data-widget-id="scene-world"]');
        commandWidget(doc, 'scene-world', 'float');
        module.style.cssText = 'left: 111px; top: 73px; width: 314px; height: 226px;';
        await new Promise((resolve) => view.setTimeout(resolve, 260));
        await nextFrame(view);
        const origin = captureWidgetOrigin(module);
        const handle = module.querySelector('[data-widget-drag-surface]');
        beginDrag(doc, handle);
        const panelTab = doc.querySelector('[data-panel-tab="panel-scene"]');
        const target = center(panelTab);
        pointer(doc, 'pointermove', target);
        pointer(doc, 'pointerup', target);
        await new Promise((resolve) => view.setTimeout(resolve, 260));
        assertWidgetRestored(module, origin, 'Floating World State');
      }),
      run('Floating uses the dragged window without a duplicate trailing ghost', async (doc) => {
        const effectsHead = doc.querySelector('[data-widget-id="scene-world"] [data-widget-drag-surface]');
        const scene = doc.querySelector('.sonder-scene');
        assert(effectsHead && scene, 'Required drag surfaces were not rendered');
        beginDrag(doc, effectsHead);
        const target = center(scene);
        pointer(doc, 'pointermove', target);
        const ghost = doc.querySelector('[data-snap-ghost]');
        const module = doc.querySelector('[data-widget-id="scene-world"]');
        assert(ghost.hidden, 'A duplicate floating ghost is still visible');
        assert(module.classList.contains('is-float-ready'), 'The dragged window does not indicate that it will remain floating');
      })
    ]).then((tests) => {
      const passed = tests.filter((test) => test.passed).length;
      results.innerHTML = `<h1>${passed}/${tests.length} passed</h1>` + tests.map((test) =>
        `<p class="${test.passed ? 'pass' : 'fail'}">${test.passed ? 'PASS' : 'FAIL'} — ${test.name}${test.error ? `<br>${test.error}` : ''}</p>`
      ).join('');
      document.title = `${passed === tests.length ? 'PASS' : 'FAIL'} — Sonder drag regression`;
    });
  </script>
</body>
</html>
